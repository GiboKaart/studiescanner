<script>


// ======================================================
// API URL
// ======================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx1yy6dCMu8uiKgMxR6WTRTN3o1qxbxWctSSdZ_uPpime56D7LYLS3cWi4JnT0v4hChzA/exec";



// ======================================================
// VARIABELEN
// ======================================================

let studiePin = "";

let scanner = null;

let modus = "snel";

let bezig = false;

let laatsteDirecteCode = "";
let laatsteDirecteTijd = 0;

let wachtrij = [];

let leerlingIndex = {};

let audioContext = null;

let scanFlashTimer = null;



// ======================================================
// API
// ======================================================

function apiCall(params, callback) {


  const callbackNaam =
    "cb_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  let klaar = false;



  function opruimen() {

    if (klaar) return;

    klaar = true;


    try {

      delete window[
        callbackNaam
      ];

    }

    catch (e) {}


    try {

      script.remove();

    }

    catch (e) {}

  }



  window[callbackNaam] =
    function(data) {

      opruimen();

      callback(data);

    };



  params.callback =
    callbackNaam;



  const query =
    new URLSearchParams(
      params
    ).toString();



  script.src =
    API_URL +
    "?" +
    query;



  script.onerror =
    function() {


      opruimen();

      bezig = false;


      toonFout(
        "Geen verbinding met het studiesysteem."
      );

    };



  document.body.appendChild(
    script
  );

}



// ======================================================
// AUTOMATISCH OPENEN
// ======================================================

window.addEventListener(
  "load",

  function() {


    const opgeslagenPin =
      localStorage.getItem(
        "studiePin"
      );


    if (opgeslagenPin) {


      document
        .getElementById(
          "pin"
        )
        .value =
        opgeslagenPin;


      startSysteem();

    }

  }
);



// ======================================================
// START
// ======================================================

function startSysteem() {


  studiePin =
    document
      .getElementById(
        "pin"
      )
      .value
      .trim();



  if (!studiePin) {


    toonFout(
      "Vul eerst de studie-PIN in."
    );


    return;

  }



  // Audio activeren na gebruikersinteractie.
  activeerAudio();



  apiCall(

    {

      actie: "status",

      pin: studiePin

    },


    function(r) {


      if (!r.succes) {


        localStorage.removeItem(
          "studiePin"
        );


        toonFout(
          r.melding
        );


        return;

      }



      localStorage.setItem(
        "studiePin",
        studiePin
      );



      document
        .getElementById(
          "aantal"
        )
        .innerText =
        r.aantal;



      document
        .getElementById(
          "pinCard"
        )
        .style.display =
        "none";



      document
        .getElementById(
          "scannerCard"
        )
        .style.display =
        "block";



      startCamera();


      laadLeerlingIndex();

    }

  );

}



// ======================================================
// AUDIO ACTIVEREN
// ======================================================

function activeerAudio() {


  try {


    if (!audioContext) {


      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


  }

  catch (e) {

    console.log(
      "Audio niet beschikbaar.",
      e
    );

  }

}



// ======================================================
// LEERLINGENLIJST
// ======================================================

function laadLeerlingIndex() {


  apiCall(

    {

      actie:
        "leerlingenlijst",

      pin:
        studiePin

    },


    function(r) {


      if (
        r.succes &&
        r.leerlingen
      ) {


        leerlingIndex =
          r.leerlingen;

      }

    }

  );

}



// ======================================================
// CAMERA
// ======================================================

function startCamera() {


  if (scanner) return;



  scanner =
    new Html5Qrcode(
      "reader"
    );



  scanner
    .start(

      {

        facingMode:
          "environment"

      },


      {

        fps: 20,


        qrbox:
          function(
            width,
            height
          ) {


            const grootte =
              Math.min(
                width,
                height
              ) * 0.85;


            return {

              width:
                grootte,

              height:
                grootte

            };

          }

      },


      qrGevonden

    )


    .catch(
      function() {


        scanner = null;


        toonFout(
          "Camera kon niet worden gestart."
        );

      }
    );

}



// ======================================================
// QR GEVONDEN
// ======================================================

function qrGevonden(code) {


  code =
    String(
      code || ""
    ).trim();


  if (!code) return;



  if (
    modus === "snel"
  ) {


    voegAanWachtrijToe(
      code
    );


  }

  else {


    directeScan(
      code
    );

  }

}



// ======================================================
// SNELSCAN
// ======================================================

function voegAanWachtrijToe(code) {


  // Dubbele scan voorkomen
  if (

    wachtrij.some(
      item =>
        item.code === code
    )

  ) {


    return;

  }



  const leerling =
    leerlingIndex[
      code
    ];



  wachtrij.push({

    code:
      code,


    voornaam:
      leerling
        ? leerling.voornaam
        : "",


    achternaam:
      leerling
        ? leerling.achternaam
        : "",


    klas:
      leerling
        ? leerling.klas
        : ""

  });



  tekenWachtrij();


  toonScanSucces(
    leerling
  );

}



// ======================================================
// GROENE SCANBEVESTIGING
// ======================================================

function toonScanSucces(
  leerling
) {


  const flash =
    document.getElementById(
      "scanSuccessFlash"
    );


  const naam =
    document.getElementById(
      "scanSuccessName"
    );


  const klas =
    document.getElementById(
      "scanSuccessClass"
    );



  if (!flash) return;



  if (leerling) {


    naam.innerText =
      (
        leerling.voornaam +
        " " +
        leerling.achternaam
      ).trim();


    klas.innerText =
      leerling.klas
        ? "Klas " +
          leerling.klas
        : "";


  }

  else {


    naam.innerText =
      "QR-code gescand";


    klas.innerText =
      "";

  }



  speelScanPiep();


  tril(80);



  if (
    scanFlashTimer
  ) {


    clearTimeout(
      scanFlashTimer
    );

  }



  flash.classList.add(
    "show"
  );



  scanFlashTimer =
    setTimeout(

      function() {


        flash.classList.remove(
          "show"
        );


      },

      550

    );

}



// ======================================================
// SCANNERPIEP
// ======================================================

function speelScanPiep() {


  try {


    activeerAudio();


    if (!audioContext) {
      return;
    }



    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();



    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );



    oscillator.type =
      "sine";


    oscillator.frequency.value =
      1350;



    const nu =
      audioContext.currentTime;



    gain.gain.setValueAtTime(
      0.35,
      nu
    );


    gain.gain
      .exponentialRampToValueAtTime(
        0.01,
        nu + 0.13
      );



    oscillator.start(
      nu
    );


    oscillator.stop(
      nu + 0.13
    );


  }

  catch (e) {


    console.log(
      "Scannerpiep niet beschikbaar.",
      e
    );

  }

}



// ======================================================
// WACHTRIJ TONEN
// ======================================================

function tekenWachtrij() {


  const lijst =
    document.getElementById(
      "wachtrij"
    );



  document
    .getElementById(
      "wachtrijAantal"
    )
    .innerText =
    wachtrij.length;



  const knop =
    document.getElementById(
      "verwerkKnop"
    );



  knop.disabled =
    wachtrij.length === 0;



  knop.innerText =

    wachtrij.length === 0

      ? "Verwerk scans"

      : "Verwerk " +
        wachtrij.length +
        " scans";



  if (
    wachtrij.length === 0
  ) {


    lijst.innerHTML =
      '<p class="klein">Nog geen QR-codes gescand.</p>';


    return;

  }



  let html = "";



  wachtrij.forEach(

    function(
      item,
      index
    ) {


      let naam;



      if (
        item.voornaam
      ) {


        naam =
          escapeHtml(

            item.voornaam +
            " " +
            item.achternaam

          );


      }

      else {


        naam =
          "QR-code " +
          (index + 1);

      }



      html += `

        <div class="scanItem">

          <div>

            <div class="scanNaam">
              ${naam}
            </div>

            <div class="scanKlas">

              ${
                item.klas

                  ? "Klas " +
                    escapeHtml(
                      item.klas
                    )

                  : "Klaar om te verwerken"
              }

            </div>

          </div>


          <button
            class="verwijder"
            onclick="verwijderUitWachtrij(${index})"
          >
            ✕
          </button>

        </div>

      `;

    }

  );



  lijst.innerHTML =
    html;

}



// ======================================================
// VERWIJDEREN
// ======================================================

function verwijderUitWachtrij(
  index
) {


  wachtrij.splice(
    index,
    1
  );


  tekenWachtrij();

}



function leegWachtrij() {


  wachtrij = [];


  tekenWachtrij();

}



// ======================================================
// WACHTRIJ VERWERKEN
// ======================================================

async function verwerkWachtrij() {


  if (
    bezig ||
    wachtrij.length === 0
  ) {

    return;

  }



  bezig = true;



  const knop =
    document.getElementById(
      "verwerkKnop"
    );



  knop.disabled =
    true;


  knop.innerText =
    "Bezig met verwerken…";



  const codes =
    wachtrij.map(
      item =>
        item.code
    );



  const blokken = [];



  for (
    let i = 0;
    i < codes.length;
    i += 20
  ) {


    blokken.push(

      codes.slice(
        i,
        i + 20
      )

    );

  }



  let totaalVerwerkt = 0;

  let totaalReeds = 0;

  let totaalFouten = 0;

  let huidigAantal = null;



  try {


    for (
      const blok
      of blokken
    ) {


      const resultaat =
        await apiCallPromise({

          actie:
            "batch",

          pin:
            studiePin,

          codes:
            JSON.stringify(
              blok
            )

        });



      if (
        !resultaat.succes
      ) {


        throw new Error(

          resultaat.melding ||
          "Verwerking mislukt."

        );

      }



      totaalVerwerkt +=
        resultaat.verwerkt
          ? resultaat.verwerkt.length
          : 0;



      totaalReeds +=
        resultaat.reeds
          ? resultaat.reeds.length
          : 0;



      totaalFouten +=
        resultaat.fouten
          ? resultaat.fouten.length
          : 0;



      huidigAantal =
        resultaat.aantal;

    }



    if (
      huidigAantal !== null
    ) {


      document
        .getElementById(
          "aantal"
        )
        .innerText =
        huidigAantal;

    }



    wachtrij = [];


    tekenWachtrij();



    tril(
      [80, 50, 80]
    );



    toonBatchResultaat(

      totaalVerwerkt,
      totaalReeds,
      totaalFouten

    );


  }

  catch (fout) {


    toonFout(

      fout.message ||
      "Er ging iets mis."

    );


  }

  finally {


    bezig = false;


    tekenWachtrij();

  }

}



// ======================================================
// API ALS PROMISE
// ======================================================

function apiCallPromise(
  params
) {


  return new Promise(

    function(resolve) {


      apiCall(
        params,
        resolve
      );


    }

  );

}



// ======================================================
// RESULTAAT BATCH
// ======================================================

function toonBatchResultaat(
  verwerkt,
  reeds,
  fouten
) {


  const box =
    document.getElementById(
      "resultaat"
    );



  box.style.display =
    "block";


  box.className =
    "info";



  document
    .getElementById(
      "icoon"
    )
    .innerText =
    "✓";



  document
    .getElementById(
      "naam"
    )
    .innerText =
    verwerkt +
    " leerlingen verwerkt";



  document
    .getElementById(
      "klas"
    )
    .innerText =
    "";



  let tekst =
    verwerkt +
    " aangemeld";



  if (
    reeds > 0
  ) {


    tekst +=
      " • " +
      reeds +
      " reeds aangemeld";

  }



  if (
    fouten > 0
  ) {


    tekst +=
      " • " +
      fouten +
      " niet herkend";

  }



  document
    .getElementById(
      "status"
    )
    .innerText =
    tekst;



  document
    .getElementById(
      "tijd"
    )
    .innerText =
    "";



  setTimeout(

    function() {


      box.style.display =
        "none";


    },

    4500

  );

}



// ======================================================
// DIRECTE SCAN
// ======================================================

function directeScan(code) {


  const nu =
    Date.now();



  if (bezig) return;



  if (

    code ===
      laatsteDirecteCode &&

    nu -
      laatsteDirecteTijd <
      5000

  ) {


    return;

  }



  laatsteDirecteCode =
    code;


  laatsteDirecteTijd =
    nu;


  bezig =
    true;



  apiCall(

    {

      actie:
        "scan",

      pin:
        studiePin,

      code:
        code

    },


    function(r) {


      bezig =
        false;



      if (
        !r.succes
      ) {


        toonFout(
          r.melding
        );


        return;

      }



      document
        .getElementById(
          "aantal"
        )
        .innerText =
        r.aantal;



      toonDirectResultaat(
        r
      );


    }

  );

}



// ======================================================
// DIRECT RESULTAAT
// ======================================================

function toonDirectResultaat(
  r
) {


  const box =
    document.getElementById(
      "resultaat"
    );



  box.style.display =
    "block";



  document
    .getElementById(
      "naam"
    )
    .innerText =
    r.voornaam +
    " " +
    r.achternaam;



  document
    .getElementById(
      "klas"
    )
    .innerText =
    "Klas " +
    r.klas;



  document
    .getElementById(
      "tijd"
    )
    .innerText =
    r.tijd;



  if (
    r.status ===
    "AANGEMELD"
  ) {


    box.className =
      "aan";



    document
      .getElementById(
        "icoon"
      )
      .innerText =
      "✓";



    document
      .getElementById(
        "status"
      )
      .innerText =
      "AANGEMELD";



    speelScanPiep();


    tril(80);


  }

  else {


    box.className =
      "af";



    document
      .getElementById(
        "icoon"
      )
      .innerText =
      "↩";



    document
      .getElementById(
        "status"
      )
      .innerText =
      "AFGEMELD";



    tril(
      [100, 70, 100]
    );

  }



  setTimeout(

    function() {


      box.style.display =
        "none";


    },

    2500

  );

}



// ======================================================
// MODUS

function kiesModus(

) {

  const snel =

    );

// ======================================================
// OVERZICHT
// ======================================================

function toonOverzicht() {


  document
    .getElementById(
      "scannerCard"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "overzichtCard"
    )
    .style.display =
    "block";


  laadOverzicht();

}



function laadOverzicht() {


  apiCall(

    {

      actie:
        "overzicht",

      pin:
        studiePin

    },


    function(r) {


      if (
        !r.succes
      ) {


        toonFout(
          r.melding
        );


        return;

      }



      document
        .getElementById(
          "aantal"
        )
        .innerText =
        r.totaal;



      const inhoud =
        document.getElementById(
          "overzichtInhoud"
        );



      let html = `

        <div class="overzichtTotaal">

          ${r.totaal}
          leerlingen aanwezig

        </div>

      `;



      const klassen =
        Object.keys(
          r.klassen
        )
        .sort(

          (a, b) =>

            a.localeCompare(

              b,

              undefined,

              {
                numeric: true
              }

            )

        );



      if (
        klassen.length === 0
      ) {


        html += `

          <p class="klein">

            Momenteel zijn er geen leerlingen aangemeld.

          </p>

        `;

      }



      klassen.forEach(

        function(klas) {


          const leerlingen =
            r.klassen[
              klas
            ];



          html += `

            <div class="klasblok">

              <div class="klastitel">

                <span>
                  ${escapeHtml(klas)}
                </span>

                <span>
                  ${leerlingen.length}
                </span>

              </div>

          `;



          leerlingen.forEach(

            function(leerling) {


              html += `

                <div class="leerling">

                  ${escapeHtml(
                    leerling.voornaam
                  )}

                  ${escapeHtml(
                    leerling.achternaam
                  )}

                </div>

              `;

            }

          );



          html += `

            </div>

          `;

        }

      );



      inhoud.innerHTML =
        html;

    }

  );

}

function toonFout(

) {

    document.getElementById(

    );



  box.style.display =
    "block";


  box.className =

  );

// ======================================================
// TRILLING
// ======================================================

function tril(
  patroon
) {


  if (
    navigator.vibrate
  ) {


    navigator.vibrate(
      patroon
    );

  }

}



// ======================================================
// HTML VEILIG MAKEN
// ======================================================

function escapeHtml(
  tekst
) {


  return String(
    tekst || ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
