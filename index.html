<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>GIBO Kaart - Studie</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #7660a7;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 5px 0 0;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 9px rgba(0,0,0,.08);
    }

    .counter {
      text-align: center;
    }

    #aantal {
      font-size: 54px;
      font-weight: bold;
      color: #7660a7;
    }

    .resultaat {
      display: none;
      text-align: center;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .aan {
      background: #e1f5eb;
      border: 3px solid #55b88d;
    }

    .af {
      background: #fde5ef;
      border: 3px solid #e61d79;
    }

    .fout {
      background: #fff5cb;
      border: 3px solid #fad517;
    }

    #icoon {
      font-size: 48px;
    }

    #naam {
      font-size: 27px;
      font-weight: bold;
    }

    #klas {
      margin-top: 4px;
      font-size: 18px;
    }

    #status {
      margin-top: 12px;
      font-size: 22px;
      font-weight: bold;
    }

    #tijd {
      margin-top: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .groen {
      background: #55b88d;
      color: white;
    }

    .paars {
      background: #7660a7;
      color: white;
    }

    .roze {
      background: #e61d79;
      color: white;
    }

    #scannerCard,
    #overzichtCard {
      display: none;
    }

    #reader {
      width: 100%;
    }

    .klasblok {
      border: 1px solid #ddd;
      border-radius: 13px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .klastitel {
      background: #7660a7;
      color: white;
      padding: 12px 14px;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
    }

    .leerlingen {
      padding: 5px 14px;
    }

    .leerling {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .leerling:last-child {
      border-bottom: none;
    }

    .overzichtTotaal {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .klein {
      text-align: center;
      font-size: 13px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<header>
  <h1>GIBO Kaart</h1>
  <p>Studie – aanwezigheden</p>
</header>

<div class="container">

  <div class="card counter">
    <div id="aantal">–</div>
    <div>leerlingen momenteel aangemeld</div>
  </div>

  <div id="resultaat" class="resultaat">
    <div id="icoon"></div>
    <div id="naam"></div>
    <div id="klas"></div>
    <div id="status"></div>
    <div id="tijd"></div>
  </div>

  <div id="pinCard" class="card">
    <h3 style="text-align:center">
      Studie openen
    </h3>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="Studie-PIN"
    >

    <button
      class="groen"
      onclick="startSysteem()"
    >
      Scanner starten
    </button>
  </div>

  <div id="scannerCard" class="card">

    <div id="reader"></div>

    <p class="klein">
      Richt de camera op de QR-code van de leerling.
    </p>

    <button
      class="paars"
      onclick="toonOverzicht()"
    >
      👥 Aanwezigheden bekijken
    </button>

  </div>

  <div id="overzichtCard" class="card">

    <h2 style="text-align:center">
      Aanwezig vandaag
    </h2>

    <div id="overzichtInhoud"></div>

    <button
      class="roze"
      onclick="sluitOverzicht()"
    >
      Terug naar scanner
    </button>

  </div>

</div>

<script>

// ======================================================
// PLAK HIER JE APPS SCRIPT /exec URL
// ======================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx1yy6dCMu8uiKgMxR6WTRTN3o1qxbxWctSSdZ_uPpime56D7LYLS3cWi4JnT0v4hChzA/exec";

let studiePin = "";
let scanner = null;
let bezig = false;

let laatsteCode = "";
let laatsteTijd = 0;


// ======================================================
// API
// ======================================================

function apiCall(params, callback) {

  const callbackNaam =
    "cb_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);

  const script =
    document.createElement("script");

  window[callbackNaam] = function(data) {

    callback(data);

    delete window[callbackNaam];

    script.remove();

  };

  params.callback =
    callbackNaam;

  const query =
    new URLSearchParams(params).toString();

  script.src =
    API_URL + "?" + query;

  script.onerror = function() {

    bezig = false;

    toonFout(
      "Kan geen verbinding maken met het studiesysteem."
    );

  };

  document.body.appendChild(script);
}


// ======================================================
// SNELLER OPENEN: PIN ONTHOUDEN
// ======================================================

window.addEventListener("load", function() {

  const opgeslagenPin =
    localStorage.getItem("studiePin");

  if (opgeslagenPin) {

    document
      .getElementById("pin")
      .value =
      opgeslagenPin;

    startSysteem();

  }

});


// ======================================================
// START
// ======================================================

function startSysteem() {

  studiePin =
    document
      .getElementById("pin")
      .value
      .trim();

  if (!studiePin) {

    toonFout(
      "Vul eerst de studie-PIN in."
    );

    return;

  }

  localStorage.setItem(
    "studiePin",
    studiePin
  );

  apiCall(
    {
      actie: "status",
      pin: studiePin
    },

    function(resultaat) {

      if (!resultaat.succes) {

        toonFout(resultaat.melding);

        localStorage.removeItem(
          "studiePin"
        );

        return;

      }

      document
        .getElementById("aantal")
        .innerText =
        resultaat.aantal;

      document
        .getElementById("pinCard")
        .style.display =
        "none";

      document
        .getElementById("scannerCard")
        .style.display =
        "block";

      startCamera();

    }
  );
}


// ======================================================
// CAMERA
// ======================================================

function startCamera() {

  if (scanner) {
    return;
  }

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 20,

      qrbox: function(
        width,
        height
      ) {

        const grootte =
          Math.min(
            width,
            height
          ) * 0.85;

        return {
          width: grootte,
          height: grootte
        };

      },

      aspectRatio: 1.0
    },

    qrGevonden

  )

  .catch(function() {

    scanner = null;

    toonFout(
      "De camera kon niet worden gestart. Controleer de cameratoestemming."
    );

  });
}


// ======================================================
// QR GEVONDEN
// ======================================================

function qrGevonden(code) {

  const nu =
    Date.now();

  if (bezig) {
    return;
  }

  if (
    code === laatsteCode &&
    nu - laatsteTijd < 5000
  ) {
    return;
  }

  bezig = true;

  laatsteCode = code;

  laatsteTijd = nu;

  apiCall(
    {
      actie: "scan",
      pin: studiePin,
      code: code
    },

    function(resultaat) {

      bezig = false;

      if (!resultaat.succes) {

        toonFout(
          resultaat.melding
        );

        return;

      }

      document
        .getElementById("aantal")
        .innerText =
        resultaat.aantal;

      toonLeerling(
        resultaat
      );

    }
  );
}


// ======================================================
// SCANRESULTAAT
// ======================================================

function toonLeerling(r) {

  const box =
    document.getElementById(
      "resultaat"
    );

  box.style.display =
    "block";

  document
    .getElementById("naam")
    .innerText =
    r.voornaam +
    " " +
    r.achternaam;

  document
    .getElementById("klas")
    .innerText =
    "Klas " + r.klas;

  document
    .getElementById("tijd")
    .innerText =
    r.tijd;

  if (
    r.status === "AANGEMELD"
  ) {

    box.className =
      "resultaat aan";

    document
      .getElementById("icoon")
      .innerText =
      "✓";

    document
      .getElementById("status")
      .innerText =
      "AANGEMELD";

    tril(80);

  }

  else {

    box.className =
      "resultaat af";

    document
      .getElementById("icoon")
      .innerText =
      "↩";

    document
      .getElementById("status")
      .innerText =
      "AFGEMELD";

    tril([100, 80, 100]);

  }

  setTimeout(function() {

    box.style.display =
      "none";

  }, 2500);
}


// ======================================================
// TRILLING
// ======================================================

function tril(patroon) {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      patroon
    );

  }
}


// ======================================================
// FOUT
// ======================================================

function toonFout(melding) {

  const box =
    document.getElementById(
      "resultaat"
    );

  box.style.display =
    "block";

  box.className =
    "resultaat fout";

  document
    .getElementById("icoon")
    .innerText =
    "⚠";

  document
    .getElementById("naam")
    .innerText =
    "Niet verwerkt";

  document
    .getElementById("klas")
    .innerText =
    "";

  document
    .getElementById("status")
    .innerText =
    melding;

  document
    .getElementById("tijd")
    .innerText =
    "";

  tril([150, 100, 150]);

  setTimeout(function() {

    box.style.display =
      "none";

  }, 4000);
}


// ======================================================
// OVERZICHT
// ======================================================

function toonOverzicht() {

  document
    .getElementById("scannerCard")
    .style.display =
    "none";

  document
    .getElementById("overzichtCard")
    .style.display =
    "block";

  laadOverzicht();

}


function laadOverzicht() {

  apiCall(
    {
      actie: "overzicht",
      pin: studiePin
    },

    function(resultaat) {

      if (!resultaat.succes) {

        toonFout(
          resultaat.melding
        );

        return;
      }

      document
        .getElementById("aantal")
        .innerText =
        resultaat.totaal;

      const inhoud =
        document.getElementById(
          "overzichtInhoud"
        );

      let html = `
        <div class="overzichtTotaal">
          ${resultaat.totaal}
          leerlingen aanwezig
        </div>
      `;

      const klassen =
        Object.keys(
          resultaat.klassen
        ).sort(
          (a, b) =>
            a.localeCompare(
              b,
              undefined,
              { numeric: true }
            )
        );

      if (
        klassen.length === 0
      ) {

        html += `
          <p style="text-align:center">
            Momenteel zijn er geen leerlingen aangemeld.
          </p>
        `;
      }

      klassen.forEach(
        function(klas) {

          const leerlingen =
            resultaat.klassen[klas];

          html += `
            <div class="klasblok">

              <div class="klastitel">

                <span>
                  ${escapeHtml(klas)}
                </span>

                <span>
                  ${leerlingen.length}
                </span>

              </div>

              <div class="leerlingen">
          `;

          leerlingen.forEach(
            function(leerling) {

              html += `
                <div class="leerling">
                  ${escapeHtml(
                    leerling.voornaam
                  )}
                  ${escapeHtml(
                    leerling.achternaam
                  )}
                </div>
              `;

            }
          );

          html += `
              </div>
            </div>
          `;

        }
      );

      inhoud.innerHTML =
        html;

    }
  );
}


// ======================================================
// TERUG NAAR SCANNER
// ======================================================

function sluitOverzicht() {

  document
    .getElementById("overzichtCard")
    .style.display =
    "none";

  document
    .getElementById("scannerCard")
    .style.display =
    "block";
}


// ======================================================
// VEILIGE TEKST
// ======================================================

function escapeHtml(tekst) {

  return String(tekst || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
